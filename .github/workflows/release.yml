name: Release

on:
  push:
    branches: [main]
    paths:
      - 'skills/*/VERSION'
      - 'skills/*/package.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: bash scripts/release-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}

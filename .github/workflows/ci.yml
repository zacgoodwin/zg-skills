name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      stack-ship: ${{ steps.filter.outputs.stack-ship }}
      z-adversarial-review: ${{ steps.filter.outputs.z-adversarial-review }}
      zg-doc-integrity: ${{ steps.filter.outputs.zg-doc-integrity }}
      dev-as-ai: ${{ steps.filter.outputs.dev-as-ai }}
      dev-as-human: ${{ steps.filter.outputs.dev-as-human }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            stack-ship:
              - 'skills/stack-ship/**'
            z-adversarial-review:
              - 'skills/z-adversarial-review/**'
            zg-doc-integrity:
              # The cli.ts parity test compares against the sibling, so a change
              # there has to re-run this skill's suite too.
              - 'skills/zg-doc-integrity/**'
              - 'skills/z-adversarial-review/lib/cli.ts'
            dev-as-ai:
              - 'skills/dev-as-ai/**'
            dev-as-human:
              - 'skills/dev-as-human/**'

  stack-ship:
    needs: changes
    if: needs.changes.outputs.stack-ship == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/stack-ship
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/gate.sh

  z-adversarial-review:
    needs: changes
    if: needs.changes.outputs.z-adversarial-review == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/z-adversarial-review
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  zg-doc-integrity:
    needs: changes
    if: needs.changes.outputs.zg-doc-integrity == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/zg-doc-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  dev-as-ai:
    needs: changes
    if: needs.changes.outputs.dev-as-ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/dev-as-ai
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/gate.sh

  dev-as-human:
    needs: changes
    if: needs.changes.outputs.dev-as-human == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/dev-as-human
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/gate.sh
